server:
  port: ${APPLICATION_PORT:8097}

  servlet:
    session:
      cookie:
        secure: true
        same-site: none

logging:
  level:
    root: ${ROOT_LOG_LEVEL:INFO}
    de.samply: ${LOG_LEVEL:INFO}

spring:

  profiles:
    active: external-execution-not-allowed

  flyway:
    locations: classpath:db/migration
    enabled: ${PROJECT_MANAGER_DB_FLYWAY_MIGRATION_ENABLED:true}
    url: ${PROJECT_MANAGER_DB_URL:jdbc:postgresql://localhost:5432/project_manager}
    user: ${PROJECT_MANAGER_DB_USER:project_manager}
    password: ${PROJECT_MANAGER_DB_PASSWORD:project_manager}
    default-schema: samply

  datasource:
    url: ${PROJECT_MANAGER_DB_URL:jdbc:postgresql://localhost:5432/project_manager}
    username: ${PROJECT_MANAGER_DB_USER:project_manager}
    password: ${PROJECT_MANAGER_DB_PASSWORD:project_manager}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000        # Close idle connections after 30s
      connection-timeout: 30000  # Fail after 30s if no connection is available
      max-lifetime: 1800000      # Close connections after 30 min
      keepalive-time: 30000      # Prevents premature connection closure by PostgreSQL
      leak-detection-threshold: 2000  # Log warnings if a connection is not released within 2s
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048

  jpa:
    hibernate:
      ddl-auto: none
      naming_strategy: org.hibernate.cfg.ImprovedNamingStrategy
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 30
          order_inserts: true
          order_updates: true
    database: postgresql
    show-sql: ${HIBERNATE_LOG:false}
    open-in-view: false  # Avoid memory leaks

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_URL}
      client:
        provider:
          oidc:
            issuer-uri: ${OIDC_URL}
            user-name-attribute: email
        registration:
          oidc:
            client-id: ${OIDC_CLIENT_ID}
            client-secret: ${OIDC_CLIENT_SECRET:}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/{action}/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
              - email

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQEST_SIZE:10MB}

